apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        app: zabbix-server
    spec:
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-mysql:7.4.13-ubuntu
          env:
            - name: DB_SERVER_HOST
              value: zabbix-mysql
            - name: MYSQL_USER
              value: zabbix
            - name: MYSQL_PASSWORD
              value: zabbix_pass
            - name: MYSQL_DATABASE
              value: zabbix
            - name: ZBX_HOSTNAME
              value: zabbix-server
          ports:
            - containerPort: 10051
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
  namespace: argocd
spec:
  selector:
    app: zabbix-server
  ports:
    - port: 10051
      targetPort: 10051
      nodePort: 30452
  type: NodePort
