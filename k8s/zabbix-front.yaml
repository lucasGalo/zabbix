apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-frontend
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-frontend
  template:
    metadata:
      labels:
        app: zabbix-frontend
    spec:
      containers:
        - name: zabbix-frontend
          image: zabbix/zabbix-web-nginx-mysql:7.4.13-ubuntu
          env:
            - name: DB_SERVER_HOST
              value: zabbix-mysql
            - name: MYSQL_USER
              value: zabbix
            - name: MYSQL_PASSWORD
              value: zabbix_pass
            - name: MYSQL_DATABASE
              value: zabbix
            - name: ZBX_SERVER_HOST
              value: zabbix-server
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-frontend
  namespace: argocd
spec:
  selector:
    app: zabbix-frontend
  ports:
    - port: 7777        # Porta externa que você quer usar
      targetPort: 8080  # Porta interna do container (onde o frontend escuta)
      nodePort: 30777   # Porta NodePort fixa para acesso externo
  type: NodePort
